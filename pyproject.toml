[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "moodlens"
version = "0.1.0"
description = "AI-powered travel photo mood enhancement — Claude Haiku interprets your vibe, Pillow applies the colour grade"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "Pillow>=11.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "rembg>=2.0.57",
    "onnxruntime>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
moodlens = "moodlens.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["moodlens*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
